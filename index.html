<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المنصة المدرسية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- خط Tajawal لتصميم عصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        :root {
            --bg-color: #f4f7fe;
            --sidebar-bg: #ffffff;
            --primary-color: #4318ff;
            --text-main: #2b3674;
            --text-secondary: #a3edda;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            min-height: 100vh;
        }

        /* القائمة الجانبية Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #e9edf7;
        }

        .sidebar h2 {
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 30px;
            text-align: center;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li {
            margin-bottom: 10px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #707ebe;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            background: var(--primary-color);
            color: #ffffff;
        }

        /* المحتوى الرئيسي Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 24px;
        }

        .user-info {
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-main);
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.03);
        }

        /* كروت الإحصائيات Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 14px rgba(0, 0, 0, 0.03);
        }

        .stat-card p {
            color: #a3b2c7;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-card h3 {
            color: var(--text-main);
            font-size: 24px;
        }

        /* جدول البيانات Table */
        .data-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 14px rgba(0, 0, 0, 0.03);
        }

        .data-section h3 {
            color: var(--text-main);
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9edf7;
        }

        th {
            color: #a3b2c7;
            font-weight: 500;
        }

        td {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <h2>منصتي المدرسية</h2>
        <ul class="nav-links">
            <li><a href="#" class="active">الرئيسية</a></li>
            <li><a href="#">الدروس والمواد</a></li>
            <li><a href="#">الطلاب</a></li>
            <li><a href="#">الواجبات</a></li>
            <li><a href="#">الإعدادات</a></li>
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <header class="header">
            <h1>لوحة التحكم</h1>
            <div class="user-info">مرحباً بك 👋</div>
        </header>

        <!-- الإحصائيات -->
        <section class="stats-grid">
            <div class="stat-card">
                <p>إجمالي الطلاب</p>
                <h3 id="students-count">0</h3>
            </div>
            <div class="stat-card">
                <p>المواد الدراسية</p>
                <h3 id="courses-count">0</h3>
            </div>
            <div class="stat-card">
                <p>الواجبات النشطة</p>
                <h3>12</h3>
            </div>
        </section>

        <!-- قائمة الدروس والمواد من Supabase -->
        <section class="data-section">
            <h3>قائمة المواد الدراسية</h3>
            <table>
                <thead>
                    <tr>
                        <th>اسم المادة</th>
                        <th>المعلم</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="courses-table">
                    <tr>
                        <td colspan="3">جاري تحميل البيانات من Supabase...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- ربط مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. ضع بيانات Supabase الخاصة بك هنا
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. دالة لجلب المواد من جدول 'courses' لعرضها في الجدول
        async function loadCourses() {
            const { data: courses, error } = await supabase
                .from('courses')
                .select('*');

            const tableBody = document.getElementById('courses-table');

            if (error) {
                console.error('حدث خطأ:', error);
                tableBody.innerHTML = `<tr><td colspan="3" style="color:red;">خطأ في جلب البيانات (تأكد من إعدادات Supabase)</td></tr>`;
                return;
            }

            if (courses.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3">لا توجد مواد دراسية مسجلة حالياً.</td></tr>`;
                return;
            }

            // تحديث عدد المواد في الكرت
            document.getElementById('courses-count').innerText = courses.length;

            // عرض المواد في الجدول
            tableBody.innerHTML = '';
            courses.forEach(course => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${course.title || 'بدون عنوان'}</td>
                        <td>${course.teacher_name || 'غير محدد'}</td>
                        <td><span style="color: green;">نشط</span></td>
                    </tr>
                `;
            });
        }

        // تشغيل جلب البيانات عند فتح الصفحة
        loadCourses();
    </script>

</body>
</html>
