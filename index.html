<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الإدارة المدرسية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f6f9;
    color:#1f2937;
}
header{
    background:#0f766e;
    color:white;
    padding:18px;
    text-align:center;
    box-shadow:0 2px 8px #0002;
}
header h1{margin:0;font-size:23px}
header p{margin:7px 0 0;font-size:13px}

.container{
    max-width:1250px;
    margin:auto;
    padding:15px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px #0001;
    text-align:center;
}
.stat strong{
    display:block;
    font-size:28px;
    color:#0f766e;
}
.stat span{font-size:14px;color:#64748b}

nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
}
nav button{
    border:0;
    background:white;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 1px 5px #0001;
    font-weight:bold;
}
nav button.active,
nav button:hover{
    background:#0f766e;
    color:white;
}

.section{
    display:none;
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px #0001;
}
.section.active{display:block}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}
.section h2{margin:0}

input,select{
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    width:100%;
}
.search{
    max-width:300px;
}

button.primary{
    background:#0f766e;
    color:white;
    border:0;
    padding:11px 17px;
    border-radius:7px;
    cursor:pointer;
}
button.danger{
    background:#dc2626;
    color:white;
    border:0;
    padding:7px 11px;
    border-radius:6px;
    cursor:pointer;
}
button.edit{
    background:#2563eb;
    color:white;
    border:0;
    padding:7px 11px;
    border-radius:6px;
    cursor:pointer;
}

.table-wrap{
    overflow-x:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}
th,td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:right;
}
th{
    background:#f1f5f9;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:15px;
}
.modal.show{display:flex}

.modal-box{
    background:white;
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    border-radius:12px;
    padding:20px;
}
.modal-box h3{margin-top:0}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    font-size:13px;
}
.full{grid-column:1/-1}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.status{
    position:fixed;
    left:15px;
    bottom:15px;
    padding:10px 15px;
    border-radius:8px;
    background:#111827;
    color:white;
    display:none;
    z-index:2000;
}
.status.show{display:block}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:600px){
    header h1{font-size:19px}
    .form-grid{grid-template-columns:1fr}
    .full{grid-column:auto}
    .section{padding:12px}
    nav button{flex:1 1 45%}
}
</style>
</head>

<body>

<header>
    <h1>🏫 منصة الإدارة المدرسية</h1>
    <p>إدارة المؤسسة التعليمية</p>
</header>

<div class="container">

<div class="dashboard">
    <div class="stat">
        <strong id="countStudents">0</strong>
        <span>التلاميذ</span>
    </div>
    <div class="stat">
        <strong id="countTeachers">0</strong>
        <span>المعلمون</span>
    </div>
    <div class="stat">
        <strong id="countParents">0</strong>
        <span>الآباء</span>
    </div>
    <div class="stat">
        <strong id="countSubjects">0</strong>
        <span>المواد</span>
    </div>
    <div class="stat">
        <strong id="countAnnouncements">0</strong>
        <span>الإعلانات</span>
    </div>
</div>

<nav>
    <button class="active" onclick="showSection('students',this)">👨‍🎓 التلاميذ</button>
    <button onclick="showSection('teachers',this)">👨‍🏫 المعلمون</button>
    <button onclick="showSection('parents',this)">👪 الآباء</button>
    <button onclick="showSection('subjects',this)">📚 المواد</button>
    <button onclick="showSection('classes',this)">🏫 الأقسام</button>
    <button onclick="showSection('announcements',this)">📢 الإعلانات</button>
    <button onclick="showSection('attendance',this)">📋 الحضور</button>
</nav>

<!-- الطلاب -->
<section id="students" class="section active">
<div class="section-head">
    <h2>التلاميذ</h2>
    <input class="search" id="studentSearch" placeholder="بحث عن تلميذ..." oninput="filterTable('students')">
    <button class="primary" onclick="openModal('students')">＋ إضافة تلميذ</button>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>الرقم</th>
<th>الاسم</th>
<th>تاريخ الميلاد</th>
<th>الجنس</th>
<th>اسم الولي</th>
<th>القسم</th>
<th>إجراءات</th>
</tr>
</thead>
<tbody id="studentsBody"></tbody>
</table>
</div>
</section>

<!-- المعلمون -->
<section id="teachers" class="section">
<div class="section-head">
    <h2>المعلمون</h2>
    <input class="search" id="teacherSearch" placeholder="بحث عن معلم..." oninput="filterTable('teachers')">
    <button class="primary" onclick="openModal('teachers')">＋ إضافة معلم</button>
</div>
<div class="table-wrap">
<table>
