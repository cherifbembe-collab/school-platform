<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة المدرسة - تسجيل دخول المدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background-color: #f4f7fe; color: #2b3674; min-height: 100vh; display: flex; }
    
    /* شاشة تسجيل الدخول */
    #login-page { position: fixed; inset: 0; background: #f4f7fe; z-index: 999; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 380px; text-align: center; }
    .login-card h2 { color: #4318ff; margin-bottom: 20px; }
    .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e9edf7; border-radius: 10px; text-align: center; font-size: 15px; }
    .login-card button { width: 100%; padding: 12px; background: #4318ff; color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }

    /* لوحة التحكم */
    #admin-app { display: none; width: 100%; flex-direction: row; }
    .sidebar { width: 250px; background: #fff; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-left: 1px solid #e9edf7; }
    .sidebar h2 { color: #4318ff; text-align: center; font-size: 20px; }
    .nav-btn { background: none; border: none; padding: 12px 15px; text-align: right; font-size: 16px; color: #707ebe; cursor: pointer; border-radius: 10px; }
    .nav-btn.active, .nav-btn:hover { background: #4318ff; color: #fff; }
    
    .main-content { flex: 1; padding: 30px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #fff; padding: 20px; border-radius: 15px; }
    .stat-card p { font-size: 28px; font-weight: bold; }
    
    .data-section { background: #fff; padding: 25px; border-radius: 15px; }
    table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #e9edf7; }
    .btn-add { background: #4318ff; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    .btn-del { background: #ffe2e5; color: #f64e60; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. شاشة تسجيل الدخول -->
  <div id="login-page">
    <div class="login-card">
      <h2>تسجيل دخول المدير 🔑</h2>
      <input type="password" id="admin-pass" placeholder="أدخل كلمة مرور المدير">
      <button onclick="loginAdmin()">دخول المنصة</button>
      <p id="login-err" style="color:red; font-size:13px; margin-top:10px; display:none;">كلمة المرور غير صحيحة!</p>
    </div>
  </div>

  <!-- 2. التطبيق ولوحة التحكم -->
  <div id="admin-app">
    <div class="sidebar">
      <h2>منصة المدير</h2>
      <button class="nav-btn active">إدارة الطلاب</button>
      <button class="nav-btn" onclick="logout()">تسجيل الخروج 🚪</button>
    </div>

    <div class="main-content">
      <h2>لوحة التحكم الإدارية</h2>
      <br>
      <div class="stats-grid">
        <div class="stat-card">
          <h4>إجمالي الطلاب</h4>
          <p id="total-students">0</p>
        </div>
      </div>

      <div class="data-section">
        <h3>إدارة قائمة الطلاب</h3>
        <br>
        <div style="display:flex; gap:10px;">
          <input type="text" id="new-name" placeholder="اسم الطالب الجديد..." style="padding:10px; border:1px solid #ccc; border-radius:8px; flex:1;">
          <button class="btn-add" onclick="addStudent()">+ إضافة طالب</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>المعرف (#)</th>
              <th>اسم الطالب</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="students-list">
            <tr><td colspan="3">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ucffhkoeystfqnqqtdae.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_1AeKLnoJSybiFDCaaSnogA_DuoTdbCK';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // كلمة مرور المدير المؤقتة (يمكنك تغييرها من هنا)
    const ADMIN_PASSWORD = "admin";

    function loginAdmin() {
      const inputPass = document.getElementById('admin-pass').value;
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('admin-app').style.display = 'flex';
        loadStudents();
      } else {
        document.getElementById('login-err').style.display = 'block';
      }
    }

    function logout() {
      document.getElementById('login-page').style.display = 'flex';
      document.getElementById('admin-app').style.display = 'none';
    }

    async function loadStudents() {
      const { data, count } = await _supabase.from('students').select('*', { count: 'exact' });
      document.getElementById('total-students').innerText = count || (data ? data.length : 0);

      const tbody = document.getElementById('students-list');
      if (data && data.length > 0) {
        tbody.innerHTML = data.map(st => `
          <tr>
            <td>#${st.id}</td>
            <td>${st.full_name || 'بدون اسم'}</td>
            <td><button class="btn-del" onclick="deleteStudent(${st.id})">حذف 🗑️</button></td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="3">لا يوجد طلاب حتى الآن.</td></tr>';
      }
    }

    async function addStudent() {
      const name = document.getElementById('new-name').value.trim();
      if (!name) return alert('اكتب اسم الطالب أولاً');
      
      await _supabase.from('students').insert([{ full_name: name }]);
      document.getElementById('new-name').value = '';
      loadStudents();
    }

    async function deleteStudent(id) {
      if (confirm('هل تريد حذف هذا الطالب؟')) {
        await _supabase.from('students').delete().eq('id', id);
        loadStudents();
      }
    }
  </script>
</body>
</html>
